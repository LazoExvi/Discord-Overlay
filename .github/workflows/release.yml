name: Release installer

# Pushing a tag such as v1.0.1 (matching discord_overlay.__version__) builds the
# Windows installer and portable zip and publishes them as a GitHub Release.
# "Run workflow" from the Actions tab builds the current commit as a pre-release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path discord_overlay/__init__.py -Pattern '__version__ = "([0-9.]+)"'
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match __version__ $version"
          }

      # Prebuilt PyInstaller bootloaders are shared by thousands of programs, including
      # malware, so antivirus heuristics learn to distrust them. Compiling the bootloader
      # here gives this app a unique one.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile PyInstaller bootloader from source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          py -3.12 -m venv .build-venv
          $python = (Resolve-Path .\.build-venv\Scripts\python.exe).Path
          & $python -m pip install --upgrade pip wheel setuptools
          & $python -m pip download --no-binary :all: --no-deps "pyinstaller>=6.16,<7" -d pyinstaller-src
          $tarball = Get-ChildItem pyinstaller-src\pyinstaller-*.tar.gz | Select-Object -First 1
          tar -xzf $tarball.FullName -C pyinstaller-src
          $source = Get-ChildItem pyinstaller-src -Directory | Select-Object -First 1
          # The tarball ships prebuilt bootloaders; remove them so waf must compile fresh ones.
          Remove-Item -Recurse -Force (Join-Path $source.FullName "PyInstaller\bootloader\Windows-64bit-intel") -ErrorAction SilentlyContinue
          Push-Location (Join-Path $source.FullName "bootloader")
          & $python .\waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "Bootloader build failed" }
          Pop-Location
          $built = Join-Path $source.FullName "PyInstaller\bootloader\Windows-64bit-intel\run.exe"
          if (-not (Test-Path $built)) { throw "waf produced no bootloader" }
          Write-Host "Compiled bootloader: $((Get-FileHash $built -Algorithm SHA256).Hash)"
          & $python -m pip install $source.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installing the compiled PyInstaller failed" }
          & $python -m PyInstaller --version
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller is not importable after install" }

      # The shipped NPC name list is refreshed from the community sites before every
      # build. If the sites are unreachable the committed list is used unchanged.
      - name: Refresh NPC names from the community wiki and mnmdrops.com
        id: npc
        shell: pwsh
        continue-on-error: true
        run: |
          py -3.12 scripts/build_npc_names.py
          if ($LASTEXITCODE -ne 0) { throw "NPC refresh failed" }
          $changed = (git status --porcelain discord_overlay/assets/npc-names.txt) -ne $null
          "changed=$changed" >> $env:GITHUB_OUTPUT
          if ($changed) { git diff --stat discord_overlay/assets/npc-names.txt }

      # Keep the repository in step with what was shipped: push the refreshed list to
      # main through the contents API (this job is checked out at the tag, not main).
      - name: Commit refreshed NPC names to main
        if: steps.npc.outputs.changed == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $path = "discord_overlay/assets/npc-names.txt"
          $current = gh api "repos/${{ github.repository }}/contents/$path?ref=main" | ConvertFrom-Json
          $body = @{
            message = "Refresh NPC names before release ${{ github.ref_name }}"
            content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
            sha = $current.sha
            branch = "main"
          } | ConvertTo-Json
          $body | gh api -X PUT "repos/${{ github.repository }}/contents/$path" --input - | Out-Null
          Write-Host "Pushed refreshed NPC names to main"

      # No installer: Defender's cloud reputation check flags unsigned installers of
      # bundled Python apps on download, while the same program in a zip passes. The
      # app offers to add a Start Menu shortcut on first launch instead.
      - name: Build folder
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Variant directml

      - name: Scan build with Windows Defender
        shell: pwsh
        run: |
          $mp = (Get-ChildItem "C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $mp -SignatureUpdate | Out-Null
          $result = & $mp -Scan -ScanType 3 -File (Resolve-Path "dist\DiscordOverlay") -DisableRemediation
          $result | Select-String "found|Threat  "
          if ($result -match "found [1-9]") { throw "Defender flagged the build; see above" }

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path dist\DiscordOverlay -DestinationPath "DiscordOverlay-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "DiscordOverlay-$version.zip"
          $notes = @"
          **Install:** download ``DiscordOverlay-$version.zip``, right-click it and choose **Extract All**, then open the
          extracted folder and run ``DiscordOverlay.exe``. No Python needed. On first launch it offers to add itself to
          your Start Menu.

          Windows may show "Windows protected your PC" because the program is not code-signed: click **More info**,
          then **Run anyway**.

          **Updating:** extract the new zip over the old folder, or delete the old folder. Your settings are kept.

          GPU acceleration uses DirectML and works on NVIDIA, AMD, and Intel graphics; it falls back to CPU automatically.
          "@
          if ("${{ github.ref_type }}" -eq "tag") {
            gh release create "${{ github.ref_name }}" $zip --title "Discord Overlay $version" --notes $notes
          } else {
            $tag = "build-${{ github.run_number }}"
            gh release create $tag $zip --title "Discord Overlay $version (build ${{ github.run_number }})" --notes $notes --prerelease --target ${{ github.sha }}
          }
